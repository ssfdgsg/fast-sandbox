# pool-firecracker-egress.yaml — SandboxPool with the OpenSandbox egress
# Handler attached through the Sandbox Actions channel.
#
# Network policy flows through the Actions protocol only (this phase):
#   - the Pool declares egress as an actionHandlers entry (Pod-loopback
#     targetHTTPPort 18080) and as a host-process infra component;
#   - Fastlet delivers SET_BINDING (attachment + binding.input policy),
#     sandbox.runtime-ready, sandbox.data-plane-ready, REMOVE_BINDING to
#     the egress Handler on 127.0.0.1:18080;
#   - the egress process itself runs as a container in fastletTemplate,
#     sharing the Pod network namespace (host-process delivery: compiled
#     into the Pool infra revision and probed on Pod loopback, but never
#     delivered into or supervised by the guest).
#
# The credential channel (proxy host upstream / UID header / egress route
# parsing / credential vault) is deferred to a later phase.
#
# egress image: docker.io/opensandbox/egress:latest is provided by the
# requirement owner and pinned by tag; load it into Kind with:
#   kind load docker-image docker.io/opensandbox/egress:latest
#
# Apply with:
#   kubectl apply -f config/samples/pool-firecracker-egress.yaml
apiVersion: sandbox.fast.io/v1alpha2
kind: SandboxPool
metadata:
  name: firecracker-egress-pool
  namespace: fast-sandbox-system
spec:
  fastletTemplate:
    spec:
      containers:
      - name: fastlet
        image: fast-sandbox/fastlet:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: FAST_SANDBOX_RUNTIME_AGENT_SOCKET
          value: /run/fast-sandbox/firecracker/runtime.sock
        # Live-snapshot dump spill (see docs/guides/sandbox-snapshots.md):
        # sizeLimit must cover the largest sandbox memory (rule of thumb
        # 2 x memory + 1Gi); production prefers a local-NVMe hostPath.
        - name: FAST_SANDBOX_SNAPSHOT_SPILL_DIR
          value: /spill
        volumeMounts:
        - name: agent-socket
          mountPath: /run/fast-sandbox/firecracker
        - name: snapshot-spill
          mountPath: /spill
      - name: egress
        image: docker.io/opensandbox/egress:latest
        # IfNotPresent: the integration environment kind-loads the image
        # into the nodes; Always would force a docker.io pull per restart.
        imagePullPolicy: IfNotPresent
        # Fast Sandbox profile is required: it serves the Sandbox Actions Handler
        # endpoints (/_fastlet/v1/actions[/status]) that the Fastlet uses.
        # Without it egress runs the sidecar profile (policy-file driven)
        # and exposes no actions surface.
        env:
        - name: OPENSANDBOX_EGRESS_PROFILE
          value: "fast-sandbox"
        # dns+nft: DNS-based domain policy plus the per-subject nft rules
        # (table opensandbox-fast-sandbox, subj_ chains). dns-only would neither
        # block IP-direct traffic nor create the subj_ chains the
        # integration test asserts on unload.
        - name: OPENSANDBOX_EGRESS_MODE
          value: "dns+nft"
        # Recorded-policy directory: POLICY_EXPORT copies the subject's
        # policy file here (fast-sandbox env convention), the handler-relay
        # /policy/{uid} surface mutates it in place, and a restart reloads
        # it. The volume (not the container filesystem) is what makes the
        # relayed policy survive an egress container restart — the Fastlet's
        # SET_BINDING replay only re-seeds the bootstrap binding input, and
        # the file is the truth on top of it.
        - name: OPENSANDBOX_EGRESS_POLICY_DIR
          value: /var/lib/opensandbox-egress/policy
        # Vault persistence (OSEP-0022): VAULT_EXPORT requires it — without
        # the dir the egress vault store is nil and template snapshots fail
        # their complete-capture export. Plaintext v1 posture; swap to
        # medium: Memory (tmpfs) to keep vault files off node disk.
        - name: OPENSANDBOX_EGRESS_VAULT_DIR
          value: /var/lib/opensandbox-egress/vault
        volumeMounts:
        - name: egress-policy
          mountPath: /var/lib/opensandbox-egress/policy
        - name: egress-vault
          mountPath: /var/lib/opensandbox-egress
        # State bundle handoff (vault/policy export-import): the transfer
        # envelope carries the driver's staging path under the runtime state
        # root — mount the same runtime-injected volume so the path resolves
        # in this container (the pool controller owns the `firecracker-state`
        # hostPath; without it POLICY_EXPORT fails "validate-directory: no
        # such file or directory").
        - name: firecracker-state
          mountPath: /var/lib/fast-sandbox/firecracker
        # Egress installs nft/iptables rules (DNS redirect + per-subject
        # sets) and marks sockets; NET_ADMIN covers nft/iptables/SO_MARK,
        # NET_RAW covers the raw sockets used for DNS response spoofing.
        # Without these it crashes on "netlink: Operation not permitted".
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        # Platform validation requires non-zero CPU and memory limits on
        # every sidecar container so the Pod cgroup stays bounded.
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: agent-socket
        hostPath:
          path: /run/fast-sandbox/firecracker
          type: DirectoryOrCreate
      - name: snapshot-spill
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      # Recorded-policy state of the egress container (survives egress
      # restarts within the Pod; recorded policies are ≈KiB-scale, the egress
      # caps a single file at MaxEncodedPolicyFileBytes ≈ 68 KiB).
      - name: egress-policy
        emptyDir:
          sizeLimit: 16Mi
      # Pod-scoped vault volume (OSEP-0022): survives egress container
      # restarts (the reload path), dies with the Pod. Plaintext v1
      # posture — medium: Memory would keep the plaintext vault files off
      # node disk; encryption is the future fix for the storage side.
      - name: egress-vault
        emptyDir: {}
      nodeSelector:
        fast-sandbox.io/firecracker-node: "true"
  capacity:
    # poolMin=1: a single fastlet pod guarantees every egress sandbox lands
    # on the SAME egress instance — the verify-egress scenario is multiple
    # subjects with different policies on one control plane.
    poolMin: 1
    poolMax: 1
    bufferMin: 0
    bufferMax: 0
  maxSandboxesPerPod: 5
  runtime: firecracker
  # host-process declaration: no artifact is delivered; Fastlet probes the
  # Pod-loopback listener (127.0.0.1:18080) before data-plane-ready and
  # never includes egress in the guest sandbox-init supervisor config.
  infraComponents:
  - name: egress
    delivery: host-process
    process:
      command: ["/bin/egress"]
      healthCheck:
        tcpConnect: {}
        timeoutSeconds: 10
    endpoint:
      protocol: HTTP
      port: 18080
  actionHandlers:
  - name: egress
    targetHTTPPort: 18080
    hooks: [sandbox.runtime-ready, sandbox.data-plane-ready]
  # Recorded-policy usage contract (three channels, one authority order):
  #   - create: initialize the policy with the Sandbox spec's ActionBinding
  #     (actionBindings: [{handler: egress, input: <policy JSON>}]) —
  #     SET_BINDING seeds the subject's bootstrap policy from the CRD; this
  #     is the durable, restart-safe channel.
  #   - runtime: make every other mutation through the generic handler
  #     relay — fastpath InvokeHandlerAction with PUT / GET / DELETE
  #     /policy/{sandboxUid} (the egress' native semantics, revision
  #     preconditions). Relay mutations bypass the CRD, so the binding
  #     input goes stale; the relayed record is the live truth.
  #   - snapshot/pause: nothing to do — POLICY_EXPORT dumps the relayed
  #     policy file into the bundle as policy.json and the manifest records
  #     it as the egress ActionBinding, which is authoritative over the
  #     stale CRD replay at restore and clone-create.
  sandboxResources:
    cpu: "1"
    memory: 512Mi
    pids: 128
  # warmImages lookups are byte-exact (the agent resolves index/<sha256(image)>,
  # no normalization), so this entry MUST match the built template's
  # spec.image. The integration environment renders it to its (possibly
  # mirror-rewritten) SBX_IMAGE before applying; keep the default in sync
  # when applying the sample by hand.
  warmImages:
  - alpine:3.19
